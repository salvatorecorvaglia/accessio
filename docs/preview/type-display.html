<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
      }
      .row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 16px 24px;
        align-items: baseline;
      }
      .meta {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
        letter-spacing: 0.06em;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="meta">display 96/0.95 italic</div>
      <div
        style="
          font-family: var(--font-display);
          font-size: 72px;
          line-height: 0.95;
          font-style: italic;
          letter-spacing: -0.02em;
        "
      >
        Native fetch, dressed up.
      </div>

      <div class="meta">h1 — 44/700</div>
      <div class="t-h1">Fast, flexible HTTP client.</div>

      <div class="meta">h2 — 32/700</div>
      <div class="t-h2">Interceptors, retries, rate limiting.</div>

      <div class="meta">h3 — 24/600</div>
      <div class="t-h3">Quick start</div>

      <div class="meta">eyebrow — mono caps</div>
      <div class="t-eyebrow">v1.0 · zero dependencies</div>
    </div>
  </body>
</html>
