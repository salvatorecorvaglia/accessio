<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 28px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 8px;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all var(--dur) var(--ease-out);
        text-decoration: none;
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .primary:hover {
        background: var(--accent-hover);
      }
      .secondary {
        background: var(--ink-700);
        color: var(--ink-100);
        border-color: var(--border);
      }
      .secondary:hover {
        background: var(--ink-600);
        border-color: var(--border-strong);
      }
      .ghost {
        background: transparent;
        color: var(--ink-100);
        border-color: var(--border);
      }
      .ghost:hover {
        background: var(--ink-800);
      }
      .arrow {
        transition: transform var(--dur) var(--ease-out);
      }
      .primary:hover .arrow {
        transform: translateX(3px);
      }
      .focus {
        box-shadow:
          0 0 0 2px var(--bg),
          0 0 0 4px var(--amber-400);
      }
      .label {
        width: 100%;
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 8px 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="label">Buttons — primary / secondary / ghost / focus</div>
    <a class="btn primary">Get started <span class="arrow">→</span></a>
    <a class="btn primary" style="background: var(--accent-hover)">Hover</a>
    <a class="btn primary" style="background: var(--accent-press)">Press</a>
    <a class="btn secondary">View on GitHub</a>
    <a class="btn ghost">Docs</a>
    <a class="btn primary focus">Focused</a>
  </body>
</html>
