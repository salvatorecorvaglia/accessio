<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
      }
      h3 {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
      }
      .tile {
        background: var(--ink-700);
        border: 1px solid var(--border);
        height: 70px;
        display: grid;
        place-items: center;
      }
      .tile.r-sm {
        border-radius: 4px;
      }
      .tile.r {
        border-radius: 8px;
      }
      .tile.r-md {
        border-radius: 10px;
      }
      .tile.r-lg {
        border-radius: 14px;
      }
      .tile.r-xl {
        border-radius: 20px;
      }
      .tile.r-pill {
        border-radius: 999px;
      }
      .name {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
        margin-top: 6px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h3>Corner radii</h3>
    <div class="row">
      <div>
        <div class="tile r-sm"></div>
        <div class="name">--radius-sm · 4</div>
      </div>
      <div>
        <div class="tile r"></div>
        <div class="name">--radius · 8</div>
      </div>
      <div>
        <div class="tile r-md"></div>
        <div class="name">--radius-md · 10</div>
      </div>
      <div>
        <div class="tile r-lg"></div>
        <div class="name">--radius-lg · 14</div>
      </div>
      <div>
        <div class="tile r-xl"></div>
        <div class="name">--radius-xl · 20</div>
      </div>
      <div>
        <div class="tile r-pill"></div>
        <div class="name">--radius-pill</div>
      </div>
    </div>
  </body>
</html>
