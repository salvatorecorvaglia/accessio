<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
      }
      h3 {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 8px 12px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .specimen {
        background: var(--ink-900);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
      }
      .specimen .ok {
        color: var(--ok);
      }
      .specimen .warn {
        color: var(--warn);
      }
      .specimen .err {
        color: var(--err);
      }
      .specimen .info {
        color: var(--info);
      }
      .specimen .muted {
        color: var(--fg-muted);
      }
      .label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h3>Semantic — pulled from debug.ts states</h3>
    <div class="row">
      <div>
        <span class="pill" style="background: rgba(70, 201, 127, 0.1); color: #46c97f"
          ><span class="dot" style="background: #46c97f"></span> 200 OK</span
        >
        <div class="label">--ok #46C97F</div>
      </div>
      <div>
        <span class="pill" style="background: rgba(245, 177, 59, 0.1); color: #f5b13b"
          ><span class="dot" style="background: #f5b13b"></span> 304 redirect</span
        >
        <div class="label">--warn #F5B13B</div>
      </div>
      <div>
        <span class="pill" style="background: rgba(240, 104, 104, 0.1); color: #f06868"
          ><span class="dot" style="background: #f06868"></span> 500 error</span
        >
        <div class="label">--err #F06868</div>
      </div>
      <div>
        <span class="pill" style="background: rgba(58, 168, 207, 0.1); color: #3aa8cf"
          ><span class="dot" style="background: #3aa8cf"></span> retrying…</span
        >
        <div class="label">--info #3AA8CF</div>
      </div>
    </div>
    <div style="height: 14px"></div>
    <div class="specimen">
      <span class="muted">🐦‍⬛ [Accessio] →</span> GET https://api.example.com/users
      <span class="muted">(retry: 3x)</span><br />
      <span class="muted">🐦‍⬛ [Accessio] ←</span> <span class="ok">✅ 200 OK</span> (142ms) — Size:
      ~3.2 KB<br />
      <span class="muted">🐦‍⬛ [Accessio] ←</span> <span class="err">❌ ERR_NETWORK</span> — Code:
      ETIMEDOUT
    </div>
  </body>
</html>
