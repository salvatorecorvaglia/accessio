<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
      }
      .swatch {
        aspect-ratio: 1.2 / 1;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .name {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-100);
        letter-spacing: -0.01em;
      }
      .hex {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--ink-300);
        margin-top: 2px;
      }
      .swatch.light .name,
      .swatch.light .hex {
        color: #0c0f15;
      }
      .swatch.light .hex {
        color: #5a6377;
      }
      h3 {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <h3>Ink scale — surfaces & text</h3>
    <div class="row">
      <div class="swatch" style="background: #07090d">
        <div class="name">ink-1000</div>
        <div class="hex">#07090D</div>
      </div>
      <div class="swatch" style="background: #0c0f15">
        <div class="name">ink-900</div>
        <div class="hex">#0C0F15</div>
      </div>
      <div class="swatch" style="background: #12161e">
        <div class="name">ink-800</div>
        <div class="hex">#12161E</div>
      </div>
      <div class="swatch" style="background: #1b212c">
        <div class="name">ink-700</div>
        <div class="hex">#1B212C</div>
      </div>
      <div class="swatch" style="background: #262e3c">
        <div class="name">ink-600</div>
        <div class="hex">#262E3C</div>
      </div>
      <div class="swatch" style="background: #384154">
        <div class="name">ink-500</div>
        <div class="hex">#384154</div>
      </div>
      <div class="swatch light" style="background: #5a6377">
        <div class="name" style="color: #fff">ink-400</div>
        <div class="hex" style="color: #e8ebf2">#5A6377</div>
      </div>
    </div>
    <div style="height: 14px"></div>
    <div class="row">
      <div class="swatch light" style="background: #8e98ad">
        <div class="name" style="color: #0c0f15">ink-300</div>
        <div class="hex" style="color: #1b212c">#8E98AD</div>
      </div>
      <div class="swatch light" style="background: #c4cad8">
        <div class="name" style="color: #0c0f15">ink-200</div>
        <div class="hex" style="color: #384154">#C4CAD8</div>
      </div>
      <div class="swatch light" style="background: #e8ebf2">
        <div class="name" style="color: #0c0f15">ink-100</div>
        <div class="hex" style="color: #5a6377">#E8EBF2</div>
      </div>
      <div class="swatch light" style="background: #f5f6f9">
        <div class="name" style="color: #0c0f15">ink-050</div>
        <div class="hex" style="color: #5a6377">#F5F6F9</div>
      </div>
      <div class="swatch light" style="background: #fafaf7">
        <div class="name" style="color: #0c0f15">paper-50</div>
        <div class="hex" style="color: #5a6377">#FAFAF7</div>
      </div>
      <div class="swatch light" style="background: #f1f0eb">
        <div class="name" style="color: #0c0f15">paper-100</div>
        <div class="hex" style="color: #5a6377">#F1F0EB</div>
      </div>
      <div class="swatch light" style="background: #e3e1d9">
        <div class="name" style="color: #0c0f15">paper-200</div>
        <div class="hex" style="color: #5a6377">#E3E1D9</div>
      </div>
    </div>
  </body>
</html>
