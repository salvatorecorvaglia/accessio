<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 24px 28px;
        box-sizing: border-box;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .lockup svg {
        display: block;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
      }
      .label {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 8px;
      }
      .swatch-bg-light {
        background: var(--paper-50);
        padding: 16px 20px;
        border-radius: 10px;
      }
      .mark-tile {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        background: var(--ink-800);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .mark-tile.light {
        background: var(--paper-50);
      }
      .wordmark-tile {
        padding: 18px 22px;
        background: var(--ink-800);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .blackbird {
        font-size: 44px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <div
          class="lockup"
          style="
            background: var(--ink-800);
            padding: 14px 22px;
            border-radius: 12px;
            border: 1px solid var(--border);
          "
        >
          <svg viewBox="0 0 380 64" width="280" height="48" aria-hidden="true">
            <g
              fill="none"
              stroke="#e8ebf2"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 38 C 14 28, 22 22, 32 22 C 42 22, 50 26, 52 32 L 56 30 L 52 36 C 50 44, 42 50, 32 50 C 22 50, 14 46, 14 38 Z"
              />
              <circle cx="44" cy="30" r="6" />
              <path d="M50 30 L 58 28 L 50 32 Z" fill="#e8ebf2" />
              <path d="M22 34 Q 28 28, 36 32 Q 32 38, 24 38 Z" />
              <path d="M14 36 L 8 34 L 14 40" />
              <path d="M28 50 L 28 56" />
              <path d="M36 50 L 36 56" />
            </g>
            <circle cx="45" cy="29" r="2" fill="#f59321" />
            <text
              x="76"
              y="46"
              font-family="Inter Tight, sans-serif"
              font-weight="800"
              font-size="44"
              letter-spacing="-1.6"
              fill="#e8ebf2"
            >
              accessio
            </text>
          </svg>
        </div>
        <div class="label">Lockup — dark</div>
      </div>
      <div>
        <div class="lockup swatch-bg-light">
          <svg viewBox="0 0 380 64" width="280" height="48" aria-hidden="true">
            <g
              fill="none"
              stroke="#0c0f15"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 38 C 14 28, 22 22, 32 22 C 42 22, 50 26, 52 32 L 56 30 L 52 36 C 50 44, 42 50, 32 50 C 22 50, 14 46, 14 38 Z"
              />
              <circle cx="44" cy="30" r="6" />
              <path d="M50 30 L 58 28 L 50 32 Z" fill="#0c0f15" />
              <path d="M22 34 Q 28 28, 36 32 Q 32 38, 24 38 Z" />
              <path d="M14 36 L 8 34 L 14 40" />
              <path d="M28 50 L 28 56" />
              <path d="M36 50 L 36 56" />
            </g>
            <circle cx="45" cy="29" r="2" fill="#d97515" />
            <text
              x="76"
              y="46"
              font-family="Inter Tight, sans-serif"
              font-weight="800"
              font-size="44"
              letter-spacing="-1.6"
              fill="#0c0f15"
            >
              accessio
            </text>
          </svg>
        </div>
        <div class="label">Lockup — light</div>
      </div>
    </div>
  </body>
</html>
