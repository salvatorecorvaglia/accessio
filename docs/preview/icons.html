<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 18px 12px;
      }
      .ic {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--ink-200);
      }
      .ic svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.5;
      }
      .name {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <!-- Lucide-style line icons, drawn inline. Stand-in icon set; flag for replacement if a custom set lands. -->
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M5 12h14" />
        <path d="m13 6 6 6-6 6" />
      </svg>
      <div class="name">arrow-right</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12a9 9 0 1 1-9-9" />
        <path d="M21 3v6h-6" />
      </svg>
      <div class="name">refresh</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <div class="name">check</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
      <div class="name">alert</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
      <div class="name">x</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="16 18 22 12 16 6" />
        <polyline points="8 6 2 12 8 18" />
      </svg>
      <div class="name">code</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
      <div class="name">clock</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />

      <div class="name">shield-check</div>
    </div>
    <div class="ic">

        viewBox="0 0 24 24"

        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"

        />

      <div class="name">package</div>
    </div>

        viewBox="0 0 24 24"

        stroke="currentColor"

        />

    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
      <div class="name">zap</div>
    </div>
    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 2v4" />
        <path d="m4.93 4.93 2.83 2.83" />
        <path d="M2 12h4" />
        <path d="m4.93 19.07 2.83-2.83" />
        <path d="M12 18v4" />

        <path d="m19.07 4.93-2.83 2.83" />

    <div class="ic">
      <svg
        viewBox="0 0 24 24"
        fill="none"

        stroke-linecap="round"

      >

        <path d="M3 9h18" />

      <div class="name">grid</div>
    </div>
    <div class="ic" style="color: var(--accent)">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 22V12" />
        <path d="m3 7 9 5 9-5" />
        <path d="M3 7v10l9 5 9-5V7l-9-5-9 5z" />
      </svg>
      <div class="name">accent</div>
    </div>
  </body>
</html>
