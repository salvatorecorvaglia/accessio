<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
      }
      .row {
        display: flex;
        align-items: end;
        gap: 8px;
        height: 132px;
      }
      .bar {
        background: linear-gradient(180deg, var(--ink-700), var(--ink-800));
        border: 1px solid var(--border);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 6px 4px;
      }
      .bar .px {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-100);
      }
      .bar .tok {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--fg-muted);
      }
      h3 {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <h3>Spacing scale — 4px base</h3>
    <div class="row">
      <div class="bar" style="width: 14px; height: 8px"><div class="px"></div></div>
      <div class="bar" style="width: 18px; height: 14px"></div>
      <div class="bar" style="width: 22px; height: 20px"></div>
      <div class="bar" style="width: 26px; height: 28px"></div>
      <div class="bar" style="width: 34px; height: 38px"><div class="px">16</div></div>
      <div class="bar" style="width: 42px; height: 50px"><div class="px">24</div></div>
      <div class="bar" style="width: 50px; height: 62px"><div class="px">32</div></div>
      <div class="bar" style="width: 60px; height: 78px"><div class="px">48</div></div>
      <div class="bar" style="width: 72px; height: 96px"><div class="px">64</div></div>
      <div class="bar" style="width: 90px; height: 118px">
        <div class="px">96</div>
        <div class="tok">--space-9</div>
      </div>
      <div class="bar" style="width: 110px; height: 132px">
        <div class="px">128</div>
        <div class="tok">--space-10</div>
      </div>
    </div>
  </body>
</html>
