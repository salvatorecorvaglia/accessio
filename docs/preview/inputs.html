<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }
      body {
        padding: 22px 28px;
        display: grid;
        gap: 14px;
      }
      .input {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink-800);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink-100);
        transition: all var(--dur) var(--ease-out);
      }
      .input:hover {
        border-color: var(--border-strong);
      }
      .input.focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(245, 147, 33, 0.18);
      }
      .input .ph {
        color: var(--fg-muted);
      }
      .arrow {
        color: var(--accent);
      }
      .label {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg-muted);
      }
      .pair {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 14px;
        align-items: center;
      }
      .copy {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--ink-700);
        border: 1px solid var(--border);
        color: var(--ink-100);
        font-family: var(--font-mono);
        font-size: 12px;
        cursor: pointer;
      }
      .copy:hover {
        background: var(--ink-600);
      }
    </style>
  </head>
  <body>
    <div class="pair">
      <span class="label">default</span>
      <div class="input">
        <span class="arrow">$</span><span class="ph">npm install accessio</span>
      </div>
    </div>
    <div class="pair">
      <span class="label">focus</span>
      <div class="input focus">
        <span class="arrow">$</span
        ><span>npm install accessio<span style="color: var(--accent)">|</span></span>
      </div>
    </div>
    <div class="pair">
      <span class="label">copy block</span>
      <div class="input" style="justify-content: space-between">
        <span><span class="arrow">$</span> pnpm add accessio</span>
        <button class="copy">⧉ copy</button>
      </div>
    </div>
  </body>
</html>
