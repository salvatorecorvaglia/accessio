name: Release

on:
  push:
    tags:
      - 'v*'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract Changelog Section
        id: extract_changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG_NAME || '';
            const version = tag.startsWith('v') ? tag.slice(1) : tag;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = changelog.split(/\r?\n/);
            let startIdx = -1;
            let endIdx = -1;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].startsWith('## [' + version + ']')) {
                startIdx = i;
                continue;
              }
              if (startIdx !== -1 && lines[i].startsWith('## [')) {
                endIdx = i;
                break;
              }
            }
            let body = '';
            if (startIdx !== -1) {
              const sectionLines = lines.slice(startIdx + 1, endIdx !== -1 ? endIdx : lines.length);
              body = sectionLines.join('\n').trim();
            } else {
              body = 'Release notes for version ' + tag;
            }
            const fsOutput = process.env.GITHUB_OUTPUT;
            const delimiter = 'EOF_CHANGELOG';
            fs.appendFileSync(fsOutput, 'body<<' + delimiter + '\n' + body + '\n' + delimiter + '\n');
          "
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Accessio ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.body }}
          draft: false
          prerelease: false

  publish-gpr:
    name: Publish to GitHub Packages
    needs: [ci, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@salvatorecorvaglia'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Add scope for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.name = '@salvatorecorvaglia/' + pkg.name;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
