name: Release

on:
  push:
    tags:
      - 'v*'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:browser

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract Changelog Section
        id: extract_changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG_NAME || '';
            const version = tag.startsWith('v') ? tag.slice(1) : tag;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = changelog.split(/\r?\n/);
            let startIdx = -1;
            let endIdx = -1;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].startsWith('## [' + version + ']')) {
                startIdx = i;
                continue;
              }
              if (startIdx !== -1 && lines[i].startsWith('## [')) {
                endIdx = i;
                break;
              }
            }
            let body = '';
            if (startIdx !== -1) {
              const sectionLines = lines.slice(startIdx + 1, endIdx !== -1 ? endIdx : lines.length);
              body = sectionLines.join('\n').trim();
            } else {
              body = 'Release notes for version ' + tag;
            }
            const fsOutput = process.env.GITHUB_OUTPUT;
            const delimiter = 'EOF_CHANGELOG';
            fs.appendFileSync(fsOutput, 'body<<' + delimiter + '\n' + body + '\n' + delimiter + '\n');
          "
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Accessio ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.body }}
          draft: false
          prerelease: false

  publish-npm:
    name: Publish unscoped to npmjs
    needs: [ci, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm publish --access public --provenance --no-git-checks
