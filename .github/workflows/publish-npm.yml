name: Publish to npmjs

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Which tag or branch to publish?'
        required: true
        default: 'main'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
      fail-fast: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  publish-npm:
    name: Publish unscoped to npmjs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.publish_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --provenance
